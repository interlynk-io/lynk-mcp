project_name: lynk-mcp

version: 2

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy
    - /bin/bash -c 'if [ -n "$(git --no-pager diff --exit-code go.mod go.sum)" ]; then exit 1; fi'

gomod:
  proxy: false

builds:
  - id: lynk-mcp
    binary: lynk-mcp
    main: ./cmd/lynk-mcp
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -buildid=
      - -X sigs.k8s.io/release-utils/version.gitVersion={{ .Version }}
      - -X sigs.k8s.io/release-utils/version.gitCommit={{ .FullCommit }}
      - -X sigs.k8s.io/release-utils/version.gitTreeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}
      - -X sigs.k8s.io/release-utils/version.buildDate={{ .CommitDate }}
    env:
      - CGO_ENABLED=0

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes
    artifacts: archive
    output: true

archives:
  - id: lynk-mcp
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

nfpms:
  - id: lynk-mcp
    package_name: lynk-mcp
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Interlynk
    homepage: https://interlynk.io
    maintainer: Interlynk Authors <hello@interlynk.io>
    description: MCP server for Lynk version management API
    license: Apache-2.0
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/lynk-mcp/LICENSE
        file_info:
          mode: 0644

homebrew_casks:
  - name: lynk-mcp
    ids:
      - lynk-mcp
    binaries:
      - lynk-mcp
    repository:
      owner: interlynk-io
      name: homebrew-interlynk
      branch: "lynk-mcp-{{ .Version }}"
      token: "{{ .Env.INTERLYNK_RELEASE_GITHUB_TOKEN }}"
      git:
        url: "ssh://git@github.com/interlynk-io/homebrew-interlynk.git"
        private_key: "{{ .Env.INTERLYNK_RELEASE_SSH_KEY }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: interlynk-io
          name: homebrew-interlynk
          branch: main
    directory: Casks
    homepage: https://github.com/interlynk-io/lynk-mcp
    description: MCP server for Lynk SBOM and vulnerability management
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lynk-mcp"]
          end
    commit_author:
      name: interlynk-support-bot
      email: support_eng@interlynk.io
      signing:
        enabled: true
        key: "{{ .Env.GPG_SIGNING_KEY }}"
        program: gpg
        format: openpgp

scoops:
  - name: lynk-mcp
    ids:
      - lynk-mcp
    repository:
      owner: interlynk-io
      name: homebrew-interlynk
      branch: "lynk-mcp-scoop-{{ .Version }}"
      token: "{{ .Env.INTERLYNK_RELEASE_GITHUB_TOKEN }}"
      git:
        url: "ssh://git@github.com/interlynk-io/homebrew-interlynk.git"
        private_key: "{{ .Env.INTERLYNK_RELEASE_SSH_KEY }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: interlynk-io
          name: homebrew-interlynk
          branch: main
    homepage: https://github.com/interlynk-io/lynk-mcp
    description: MCP server for Lynk SBOM and vulnerability management
    license: Apache-2.0
    commit_author:
      name: interlynk-support-bot
      email: support_eng@interlynk.io
      signing:
        enabled: true
        key: "{{ .Env.GPG_SIGNING_KEY }}"
        program: gpg
        format: openpgp

winget:
  - name: lynk-mcp
    publisher: Interlynk
    publisher_url: https://interlynk.io
    publisher_support_url: https://github.com/interlynk-io/lynk-mcp/issues
    package_identifier: Interlynk.lynk-mcp
    package_name: lynk-mcp
    ids:
      - lynk-mcp
    license: Apache-2.0
    license_url: https://github.com/interlynk-io/lynk-mcp/blob/main/LICENSE
    homepage: https://github.com/interlynk-io/lynk-mcp
    short_description: MCP server for Lynk SBOM and vulnerability management
    description: MCP server for Interlynk API, enabling AI assistants to interact with Lynk organizations for SBOM management, vulnerability tracking, and compliance checking.
    tags:
      - mcp
      - sbom
      - vulnerability-management
      - software-supply-chain
    repository:
      owner: interlynk-io
      name: winget-pkgs
      branch: "lynk-mcp-{{ .Version }}"
      token: "{{ .Env.INTERLYNK_RELEASE_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: interlynk-support-bot
      email: support_eng@interlynk.io

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  prerelease: auto
  draft: true
  make_latest: true
